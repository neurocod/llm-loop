name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Both operating systems earn their place: the engine drives a terminal
    # status line, spawns provider CLIs and locks files, and every one of those
    # differs on Windows. A Linux-only matrix would pass while the tool the
    # author actually runs is broken.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor declared in pyproject (requires-python = ">=3.9"). Listing
        # it here is what turns that declaration into a tested claim rather
        # than a hopeful one.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installing the project rather than pointing pytest at src/ means the
      # packaging metadata is exercised on every push: a pyproject that no
      # longer builds fails here instead of at release time.
      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q
