name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Every operating system the README promises earns its place: the engine
    # drives a terminal status line, spawns provider CLIs and locks files, and
    # every one of those differs on Windows. A Linux-only matrix would pass while
    # the tool the author actually runs is broken. macOS is here because no
    # machine of the author's can run it: CI is its only test. Qt and `extras/`
    # stay out of this job: they are opt-in builds, not part of the package.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64. actions/python-versions has no arm64 build of
        # 3.9 after 3.9.13 or of 3.10 after 3.10.11, so there "3.9" and "3.10"
        # resolve to those older patch releases rather than failing (manifest
        # checked 2026-11-08). No x86 macos-13 fallback: that runner image is
        # being retired, and the floor is still tested on an old patch.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The floor declared in pyproject (requires-python = ">=3.9"). Listing
        # it here is what turns that declaration into a tested claim rather
        # than a hopeful one.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installing the project rather than pointing pytest at src/ means the
      # packaging metadata is exercised on every push: a pyproject that no
      # longer builds fails here instead of at release time.
      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      # The ask-user-gate plugin carries its own pins and is outside
      # `testpaths`, so pytest never reaches it. Both are stdlib-only and
      # platform-guarded, which is why they can ride the same matrix: it is the
      # only thing keeping the gate's path resolver and its wiring check honest
      # on a machine that is not the author's. One command per step: on Windows
      # the default shell (pwsh) reports only a script's LAST exit code, so a
      # failing first command in a shared step would pass.
      - name: Test the ask-user-gate hook
        run: python claude-plugin/ask-user-gate/hooks/ask_user_gate.py --self-test

      - name: Test the ask-user-gate try_patch
        run: python claude-plugin/ask-user-gate/bin/try_patch.py --selftest
