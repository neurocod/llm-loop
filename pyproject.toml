# The one manifest every Python tool reads: installer, build backend and test
# runner all take their settings from here (PEP 621).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-loop"
dynamic = ["version"]          # read from llm_loop.__version__, see below
description = "A reusable engine for autonomous LLM-CLI loops using Claude Code or Codex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "neurocod" }]
keywords = ["claude", "codex", "llm", "agent", "cli", "automation", "loop"]

# 3.9 is a measured floor, not a guess: providers.py annotates with builtin
# generics (`list[...]`), which are evaluated at runtime and only exist from
# 3.9. Nothing newer is used - the code sticks to Optional/Dict/List rather
# than PEP 604 unions - so the CI matrix starts here and proves it every push.
requires-python = ">=3.9"

# Deliberately empty, and worth keeping that way: the engine runs on the
# standard library alone: every import across the package is stdlib. Stated
# without a module count on purpose — the count goes stale the next time one is
# split out, while the property it was attached to does not.
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# `rich` stays out of `dependencies` above because nothing here needs it to run:
# the three modules that import it (cyclecore for the console and live view,
# compactline for markup escaping, textwidth for cell measurement) each do so
# behind an ImportError fallback, so an adopter who vendors the package gets
# plain uncoloured output rather than a missing dependency. It is a test extra
# because one test renders a job tag through rich's markup parser to prove the
# tag survives it, and without the package installed that test silently skips -
# which in CI means it would never run at all.
test = ["pytest>=7", "rich"]

[project.urls]
Homepage = "https://github.com/neurocod/llm-loop"
Issues = "https://github.com/neurocod/llm-loop/issues"

[tool.setuptools.dynamic]
version = { attr = "llm_loop.__version__" }

# src layout: the package is the only thing under src/, which is what keeps a
# vendoring host project from inheriting our tests/ and examples/ as top-level
# modules. See the README section on vendoring.
[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: without shipping this marker the annotations are invisible to a
# consumer's type checker, however complete they are.
[tool.setuptools.package-data]
llm_loop = ["py.typed"]

[tool.pytest.ini_options]
# Replaces a hand-rolled sys.path.insert at the top of every test file. `ideas`
# is here for test_continuous_claude.py alone: that directory is study
# material, never shipped, and reachable only while testing.
pythonpath = ["src", "ideas"]
testpaths = ["tests"]
